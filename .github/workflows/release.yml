name: Release

# A tag v<version> builds every package and publishes a GitHub release.
# Run it by hand (Actions → Release → Run workflow) to build the packages
# without publishing anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Source tarball
    runs-on: ubuntu-latest
    container: debian:trixie
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git xz-utils gcc libc6-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          meson_version=$(sed -n "s/^  version: '\(.*\)',/\1/p" meson.build)
          if [[ "$version" != "$meson_version" ]]; then
            echo "Cargo.toml says $version, meson.build says $meson_version"; exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the tarball with vendored crates
        run: |
          git config --global --add safe.directory "$PWD"
          scripts/vendored-tarball.sh "${{ steps.version.outputs.version }}" dist
      # Build input for the Debian package only; never published.
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  deb:
    name: deb (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    # Debian 13 is the floor: the package installs on it and on anything newer.
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils \
            build-essential debhelper meson blueprint-compiler \
            libgtk-4-dev libadwaita-1-dev desktop-file-utils appstream
      # gtk4-rs 0.11 needs Rust 1.92; Debian 13 ships 1.85.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: source
      - name: Build
        run: |
          v=${{ needs.source.outputs.version }}
          cp "corewatch-$v.tar.xz" "corewatch_$v.orig.tar.xz"
          tar -xf "corewatch-$v.tar.xz"
          cd "corewatch-$v"
          cp -r packaging/debian debian
          # -d: cargo and rustc come from rustup above, not from apt. debhelper
          # points HOME elsewhere, so tell rustup where its toolchains are.
          export RUSTUP_HOME="$HOME/.rustup"
          dpkg-buildpackage -us -uc -b -d
          mkdir -p ../out
          cp ../corewatch_*.deb "../out/corewatch-$v-linux-${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  rpm:
    name: rpm (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y --setopt=install_weak_deps=False rpm-build rpmdevtools dnf-plugins-core git
      - uses: actions/checkout@v4
      - name: Build
        run: |
          v=${{ needs.source.outputs.version }}
          spec=packaging/rpm/corewatch.spec
          dnf builddep -y "$spec"
          rpmdev-setuptree
          # The same tarball GitHub serves for the tag, which the spec names.
          git config --global --add safe.directory "$PWD"
          git archive --prefix="CoreWatch-$v/" -o ~/rpmbuild/SOURCES/CoreWatch-$v.tar.gz HEAD
          rpmbuild -bb "$spec"
          mkdir -p out
          cp ~/rpmbuild/RPMS/*/corewatch-*.rpm "out/corewatch-$v-linux-${{ matrix.arch }}.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  arch:
    name: Arch package
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cargo meson blueprint-compiler \
            gtk4 libadwaita appstream desktop-file-utils
          useradd -m builder
      - uses: actions/checkout@v4
      - name: Build
        run: |
          v=${{ needs.source.outputs.version }}
          mkdir -p /home/builder/pkg
          cp packaging/arch/PKGBUILD /home/builder/pkg/
          # Build from this commit instead of the tag tarball on GitHub.
          git config --global --add safe.directory "$PWD"
          git archive --prefix="CoreWatch-$v/" -o "/home/builder/pkg/corewatch-$v.tar.gz" HEAD
          chown -R builder /home/builder/pkg
          su builder -c "cd /home/builder/pkg && makepkg --noconfirm"
          mkdir -p out
          cp /home/builder/pkg/corewatch-[0-9]*.pkg.tar.zst "out/corewatch-$v-linux-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: out/*
          if-no-files-found: error

  binary:
    name: AppImage and portable tarball (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    # Self-contained builds: GTK, libadwaita, Mesa and glibc itself travel
    # inside the AppImage and the tarball (sharun), so they run on any
    # distribution, old or new, even without GTK 4 installed. Built from
    # Arch so the bundled GTK and libadwaita are the newest releases.
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git curl wget xz zsync \
            patchelf strace file binutils rust meson blueprint-compiler \
            gtk4 libadwaita mesa vulkan-icd-loader librsvg desktop-file-utils
      - uses: actions/checkout@v4
      - name: Build and install into /usr
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
          meson install -C build
      - name: Bundle the dependencies
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_ARCH: ${{ matrix.arch }}
          DESKTOP: /usr/share/applications/io.github.amirmwhdi.Corewatch.desktop
          ICON: /usr/share/icons/hicolor/scalable/apps/io.github.amirmwhdi.Corewatch.svg
          DEPLOY_OPENGL: 1
          DEPLOY_VULKAN: 1
          # Tracing would start the app, which needs a display.
          STRACE_MODE: 0
          OUTPATH: ${{ github.workspace }}/out
        run: |
          curl -fsSL -o quick-sharun \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/quick-sharun.sh
          chmod +x quick-sharun
          mkdir -p "$OUTPATH"
          ./quick-sharun /usr/bin/corewatch
      - name: Portable tarball
        run: |
          v=${{ needs.source.outputs.version }}
          name="corewatch-$v-linux-${{ matrix.arch }}"
          # The bundled tree: run ./corewatch (or ./AppRun) from anywhere.
          cp -a AppDir "$name"
          ln -sf AppRun "$name/corewatch"
          cp LICENSE "$name/"
          tar -cJf "out/$name.tar.xz" "$name"
      - name: AppImage
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_ARCH: ${{ matrix.arch }}
          OUTPATH: ${{ github.workspace }}/out
          OUTNAME: corewatch-${{ needs.source.outputs.version }}-linux-${{ matrix.arch }}.AppImage
          VERSION: ${{ needs.source.outputs.version }}
          # AppImageUpdate and similar tools find newer releases through this.
          UPINFO: gh-releases-zsync|amirmwhdi|CoreWatch|latest|corewatch-*-linux-${{ matrix.arch }}.AppImage.zsync
        run: |
          ./quick-sharun --make-appimage
          # Build metadata from appimagetool, not a release file.
          rm -f "$OUTPATH/appinfo"
      - name: Smoke test
        run: |
          ls -la out
          v=${{ needs.source.outputs.version }}
          # No FUSE in a container: let the AppImage unpack itself instead.
          APPIMAGE_EXTRACT_AND_RUN=1 "out/corewatch-$v-linux-${{ matrix.arch }}.AppImage" --version
          tar -xJf "out/corewatch-$v-linux-${{ matrix.arch }}.tar.xz" -C /tmp
          "/tmp/corewatch-$v-linux-${{ matrix.arch }}/corewatch" --version
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: corewatch-${{ needs.source.outputs.version }}-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.amirmwhdi.Corewatch.json
          arch: ${{ matrix.arch }}
          cache-key: flatpak-release-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: corewatch-*.flatpak
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [source, deb, rpm, arch, binary, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Keep only installable packages
        run: |
          cd artifacts
          rm -f corewatch-*[0-9].tar.xz
          for f in *; do
            case "$f" in
              *.deb|*.rpm|*.pkg.tar.zst|*.AppImage|*.AppImage.zsync|*-linux-*.tar.xz|*.flatpak) ;;
              *) echo "Unexpected release file: $f"; exit 1 ;;
            esac
          done
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Corewatch ${{ needs.source.outputs.version }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.source.outputs.version, '-') }}

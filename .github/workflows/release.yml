name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            nfpm_arch: amd64
            nfpm_download_arch: x86_64
            appimage_arch: x86_64

          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            nfpm_arch: arm64
            nfpm_download_arch: arm64
            appimage_arch: aarch64

    runs-on: ${{ matrix.runner }}
    # Build on the floor distribution: Ubuntu 24.04 ships GTK 4.14 and
    # libadwaita 1.5, older than the 4.18 / 1.7 the code needs. A binary
    # built against Debian 13's glibc also runs on every newer distribution.
    container: debian:trixie

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: vars
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          if grep -q '^\[package\]' Cargo.toml; then
            APP_NAME="$(sed -n '/^\[package\]/,/^\[/{s/^name[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p;}' Cargo.toml | head -n 1)"
          else
            APP_NAME="$(sed -n '/^\[package\]/,/^\[/{s/^name[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p;}' crates/app/Cargo.toml | head -n 1)"
          fi

          if [[ -z "$APP_NAME" ]]; then
            echo "Could not determine package name"
            exit 1
          fi

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Application: $APP_NAME"
          echo "Version: $VERSION"
          echo "Architecture: ${{ matrix.arch }}"

      - name: Install system dependencies
        run: |
          set -euo pipefail

          apt-get update

          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            pkg-config \
            curl \
            git \
            file \
            zstd \
            libgtk-4-dev \
            libadwaita-1-dev \
            blueprint-compiler

      - name: Install nfpm
        run: |
          set -euo pipefail

          NFPM_VERSION="2.38.0"
          NFPM_ARCH="${{ matrix.nfpm_download_arch }}"

          URL="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"

          curl -fL "$URL" -o nfpm.tar.gz

          tar -xzf nfpm.tar.gz nfpm

          install -m 755 nfpm /usr/local/bin/nfpm

          nfpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Rust project
        run: |
          set -euo pipefail

          cargo build \
            --locked \
            --release \
            -p corewatch \
            --target "${{ matrix.target }}"

      - name: Verify binary
        env:
          APP_NAME: ${{ steps.vars.outputs.app_name }}
        run: |
          set -euo pipefail

          BINARY="target/${{ matrix.target }}/release/${APP_NAME}"

          if [[ ! -f "$BINARY" ]]; then
            echo "Binary not found: $BINARY"
            exit 1
          fi

          file "$BINARY"
          test -x "$BINARY"

      - name: Prepare packaging directory
        env:
          APP_NAME: ${{ steps.vars.outputs.app_name }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

          cp "target/${{ matrix.target }}/release/${APP_NAME}" \
             "AppDir/usr/bin/${APP_NAME}"

          chmod +x "AppDir/usr/bin/${APP_NAME}"

          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/${APP_NAME}" "\$@"
          EOF

          chmod +x AppDir/AppRun

          cp data/corewatch.desktop "AppDir/${APP_NAME}.desktop"
          cp data/corewatch.desktop "AppDir/usr/share/applications/${APP_NAME}.desktop"
          cp data/icons/corewatch.svg "AppDir/${APP_NAME}.svg"
          cp data/icons/corewatch.svg "AppDir/.DirIcon"
          cp data/icons/corewatch.svg "AppDir/usr/share/icons/hicolor/scalable/apps/${APP_NAME}.svg"

      - name: Build Linux packages
        env:
          APP_NAME: ${{ steps.vars.outputs.app_name }}
          VERSION: ${{ steps.vars.outputs.version }}
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          cat > nfpm.yaml <<EOF
          name: "${APP_NAME}"
          arch: "${NFPM_ARCH}"
          platform: "linux"
          version: "${VERSION}"
          section: "utils"
          priority: "optional"
          maintainer: "Amirmahdi <https://github.com/amirmwhdi>"
          description: "A modern Linux system monitor built with Rust and GTK 4"
          homepage: "https://github.com/amirmwhdi/corewatch"
          license: "GPL-3.0-or-later"

          # Shared libraries the binary links against, per package format.
          overrides:
            deb:
              depends:
                - libgtk-4-1 (>= 4.18)
                - libadwaita-1-0 (>= 1.7)
            rpm:
              depends:
                - gtk4 >= 4.18
                - libadwaita >= 1.7
            archlinux:
              depends:
                - gtk4
                - libadwaita

          contents:
            - src: "./target/${TARGET}/release/${APP_NAME}"
              dst: "/usr/bin/${APP_NAME}"
              file_info:
                mode: 0755
            - src: "data/corewatch.desktop"
              dst: "/usr/share/applications/${APP_NAME}.desktop"
            - src: "data/icons/corewatch.svg"
              dst: "/usr/share/icons/hicolor/scalable/apps/${APP_NAME}.svg"
          EOF

          # Debian package
          nfpm pkg \
            --config nfpm.yaml \
            --packager deb \
            --target "dist/${APP_NAME}-${VERSION}-linux-${{ matrix.arch }}.deb"

          # RPM package
          nfpm pkg \
            --config nfpm.yaml \
            --packager rpm \
            --target "dist/${APP_NAME}-${VERSION}-linux-${{ matrix.arch }}.rpm"

          # Arch Linux package
          nfpm pkg \
            --config nfpm.yaml \
            --packager archlinux \
            --target "dist/${APP_NAME}-${VERSION}-linux-${{ matrix.arch }}.pkg.tar.zst"

      - name: Create AppImage
        env:
          APP_NAME: ${{ steps.vars.outputs.app_name }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail

          ARCH="${{ matrix.appimage_arch }}"
          TOOL="appimagetool-${ARCH}.AppImage"
          OUTPUT="dist/${APP_NAME}-${VERSION}-linux-${{ matrix.arch }}.AppImage"

          URL="https://github.com/AppImage/AppImageKit/releases/download/continuous/${TOOL}"

          if ! curl -fL "$URL" -o "$TOOL"; then
            echo "Could not download appimagetool for ${ARCH}"
            exit 1
          fi

          chmod +x "$TOOL"

          ARCH="$ARCH" "./$TOOL" \
            AppDir \
            "$OUTPUT" \
            --appimage-extract-and-run

          test -s "$OUTPUT"
          file "$OUTPUT"

      - name: Create binary archive
        env:
          APP_NAME: ${{ steps.vars.outputs.app_name }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail

          STAGE_DIR="staging/${APP_NAME}-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "${STAGE_DIR}/bin"
          mkdir -p "${STAGE_DIR}/share/applications"
          mkdir -p "${STAGE_DIR}/share/icons/hicolor/scalable/apps"

          cp "target/${{ matrix.target }}/release/${APP_NAME}" "${STAGE_DIR}/bin/${APP_NAME}"
          cp data/corewatch.desktop "${STAGE_DIR}/share/applications/${APP_NAME}.desktop"
          cp data/icons/corewatch.svg "${STAGE_DIR}/share/icons/hicolor/scalable/apps/${APP_NAME}.svg"
          cp README.md LICENSE "${STAGE_DIR}/"

          tar -C staging \
            -czf "dist/${APP_NAME}-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            "${APP_NAME}-${VERSION}-linux-${{ matrix.arch }}"

          rm -rf staging

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd dist

          sha256sum * > "SHA256SUMS-${{ matrix.arch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: vars
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi

          if grep -q '^\[package\]' Cargo.toml; then
            APP_NAME="$(sed -n '/^\[package\]/,/^\[/{s/^name[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p;}' Cargo.toml | head -n 1)"
          else
            APP_NAME="$(sed -n '/^\[package\]/,/^\[/{s/^name[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p;}' crates/app/Cargo.toml | head -n 1)"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Consolidate checksums
        run: |
          set -euo pipefail

          cd artifacts
          cat SHA256SUMS-* > SHA256SUMS
          rm -f SHA256SUMS-*

      - name: List release files
        run: |
          set -euo pipefail

          find artifacts -maxdepth 1 -type f -print

          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: ${{ steps.vars.outputs.app_name }} v${{ steps.vars.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

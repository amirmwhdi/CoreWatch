name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor: oldest GTK and libadwaita Corewatch supports.
          - name: floor (Debian 13)
            image: debian:trixie
            deps: apt-get update && apt-get install -y libgtk-4-dev libadwaita-1-dev blueprint-compiler pkg-config build-essential curl git xvfb xauth
          # Fedora: Red Hat / RPM ecosystem and latest GNOME upstream.
          - name: fedora (Fedora Latest)
            image: fedora:latest
            deps: dnf install -y --setopt=install_weak_deps=False gtk4-devel libadwaita-devel blueprint-compiler gcc pkgconf-pkg-config git xorg-x11-server-Xvfb xauth which curl
          # The edge: newest GTK and libadwaita.
          - name: edge (Arch)
            image: archlinux:latest
            deps: pacman -Syu --noconfirm gtk4 libadwaita blueprint-compiler pkgconf base-devel git xorg-server-xvfb xorg-xauth
    steps:
      - name: Install system dependencies
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # A virtual display lets the template test build the real window.
        run: ./scripts/run-with-display.sh cargo test --workspace
      - name: Build
        run: cargo build --workspace --release

  flatpak:
    name: flatpak (GNOME 49)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Check cargo-sources.json matches Cargo.lock
        run: |
          pip install --quiet aiohttp tomlkit 2>/dev/null || pip install --quiet --break-system-packages aiohttp tomlkit
          curl -sSfL -o /tmp/fcg.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/fcg.py Cargo.lock -o /tmp/cargo-sources.json
          diff -u packaging/flatpak/cargo-sources.json /tmp/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: corewatch.flatpak
          manifest-path: packaging/flatpak/io.github.amirmwhdi.Corewatch.json
          cache-key: flatpak-builder-${{ github.sha }}

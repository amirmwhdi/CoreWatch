name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor: oldest GTK and libadwaita Corewatch supports.
          - name: floor (Debian 13)
            image: debian:trixie
            deps: apt-get update && apt-get install -y libgtk-4-dev libadwaita-1-dev blueprint-compiler pkg-config build-essential curl git xvfb xauth
          # Fedora: Red Hat / RPM ecosystem and latest GNOME upstream.
          - name: fedora (Fedora Latest)
            image: fedora:latest
            deps: dnf install -y --setopt=install_weak_deps=False gtk4-devel libadwaita-devel blueprint-compiler gcc pkgconf-pkg-config git xorg-x11-server-Xvfb xauth which curl
          # The edge: newest GTK and libadwaita.
          - name: edge (Arch)
            image: archlinux:latest
            deps: pacman -Syu --noconfirm gtk4 libadwaita blueprint-compiler pkgconf base-devel git xorg-server-xvfb xorg-xauth
    steps:
      - name: Install system dependencies
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # A virtual display lets the template test build the real window.
        run: ./scripts/run-with-display.sh cargo test --workspace
      - name: Build
        run: cargo build --workspace --release
